{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน{% endblock %}
{% block content %}
<h2>🔑 เปลี่ยนรหัสผ่าน</h2>
<div class="card" style="max-width:420px;">
    <form method="POST">
        <label for="currentPassword">รหัสผ่านปัจจุบัน</label>
        <input type="password" id="currentPassword" name="current_password" autocomplete="current-password" required autofocus>
        <label for="newPassword">รหัสผ่านใหม่ (อย่างน้อย {{ min_length }} ตัวอักษร)</label>
        <input type="password" id="newPassword" name="new_password" minlength="{{ min_length }}" autocomplete="new-password" required>
        <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="confirmPassword" name="confirm_password" minlength="{{ min_length }}" autocomplete="new-password" required>
        <button type="submit" style="margin-top:12px;">บันทึกรหัสผ่านใหม่</button>
        <a class="btn btn-secondary" href="{{ url_for('teacher_dashboard') }}" style="margin-top:12px;">ยกเลิก</a>
    </form>
</div>
{% endblock %}
